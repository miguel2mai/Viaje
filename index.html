<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Albania 2026 | Miguel & Marina</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #map { height: 100vh; }
        .day-panel { transition: all 0.3s ease; }
    </style>
</head>
<body class="flex flex-col md:flex-row h-screen overflow-hidden">
    <aside class="w-full md:w-1/3 h-screen overflow-y-auto bg-slate-50 border-r border-slate-200 p-6 z-20 shadow-lg">
        <h1 class="text-3xl font-bold text-slate-800 mb-2">Albania 2026</h1>
        <p class="text-slate-500 mb-6 italic">Miguel & Marina | 7-13 Agosto</p>
        <div id="itinerary" class="space-y-3"></div>
    </aside>

    <main id="map" class="flex-grow"></main>

    <script>
        const plan = [
            { id: 0, day: "Día 1: Rumbo al Sur", color: "#ef4444", points: [[41.4116, 19.7188], [40.3297, 19.4678], [40.1600, 19.6400]], plan: {
                mañana: "Recogida coche en TIA.",
                mediodía: "Parada en Orikum y ascenso al Llogara Pass.",
                tarde: "Pueblo de Dhërmi (parte alta) y check-in Blue Boutique.",
                noche: "Cena relax en Royal Blue o terrazas de playa."
            }},
            { id: 1, day: "Día 2: Gjipe & Himarë", color: "#3b82f6", points: [[40.1600, 19.6400], [40.1333, 19.6833]], plan: {
                mañana: "Caminata y baño en Gjipe Beach.",
                mediodía: "Comida en restaurante bonito de la zona.",
                tarde: "Regreso a zona de Dhërmi.",
                noche: "Relax."
            }},
            { id: 2, day: "Día 3: Kayak Porto Palermo", color: "#10b981", points: [[40.1600, 19.6400], [40.0600, 19.7900], [40.1008, 19.7433]], plan: {
                mañana: "Excursión en Kayak/SUP Castillo Ali Pasha.",
                mediodía: "Almuerzo cerca del castillo.",
                tarde: "Paseo por Himarë.",
                noche: "Regreso a Dhërmi."
            }},
            { id: 3, day: "Día 4: Excursión a Corfú", color: "#f59e0b", points: [[40.1600, 19.6400], [39.8731, 20.0033], [39.6243, 19.9217]], plan: {
                mañana: "Ferry desde Saranda.",
                mediodía: "Casco histórico y fortalezas venecianas.",
                tarde: "Compras, café y ferry de regreso.",
                noche: "Regreso a Albania."
            }},
            { id: 4, day: "Día 5: Islas de Vlorë", color: "#8b5cf6", points: [[40.1600, 19.6400], [40.4000, 19.4000]], plan: {
                mañana: "Excursión en barco a las islas de Vlorë.",
                mediodía: "Comida marina en Vlorë.",
                tarde: "Regreso a Dhërmi.",
                noche: "Descanso en hotel."
            }},
            { id: 5, day: "Día 6: Regreso a Tirana", color: "#ec4899", points: [[40.1600, 19.6400], [40.7000, 19.9500], [41.3325, 19.8242]], plan: {
                mañana: "Salida hacia Tirana.",
                mediodía: "Parada técnica en Berat.",
                tarde: "Check-in Mondial Hotel, piscina.",
                noche: "Paseo y cena en Blloku."
            }},
            { id: 6, day: "Día 7: Despedida Cultural", color: "#64748b", points: [[41.3325, 19.8242], [41.4116, 19.7188]], plan: {
                mañana: "Free Tour Tirana.",
                mediodía: "Compras finales, comida y traslado aeropuerto.",
                tarde: "Salida vuelo 17:25.",
                noche: "Viaje de regreso."
            }}
        ];

        const map = L.map('map').setView([40.5, 19.8], 9);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        const routeLayer = L.layerGroup().addTo(map);

        const container = document.getElementById('itinerary');
        plan.forEach(item => {
            const div = document.createElement('div');
            div.className = "border rounded-xl bg-white overflow-hidden shadow-sm";
            div.innerHTML = `
                <div class="p-4 cursor-pointer hover:bg-slate-50 flex justify-between items-center" onclick="toggleDay(${item.id})">
                    <h3 class="font-bold text-lg" style="color:${item.color}">${item.day}</h3>
                    <span id="icon-${item.id}">▼</span>
                </div>
                <div id="panel-${item.id}" class="hidden p-4 bg-slate-50 border-t text-sm space-y-2">
                    <p><strong>Mañana:</strong> ${item.plan.mañana}</p>
                    <p><strong>Mediodía:</strong> ${item.plan.mediodía}</p>
                    <p><strong>Tarde:</strong> ${item.plan.tarde}</p>
                    <p><strong>Noche:</strong> ${item.plan.noche}</p>
                </div>
            `;
            container.appendChild(div);
        });

        function toggleDay(id) {
            const panel = document.getElementById(`panel-${id}`);
            const icon = document.getElementById(`icon-${id}`);
            panel.classList.toggle('hidden');
            icon.innerText = panel.classList.contains('hidden') ? '▼' : '▲';
            
            routeLayer.clearLayers();
            const day = plan[id];
            L.polyline(day.points, { color: day.color, weight: 6, opacity: 0.8 }).addTo(routeLayer);
            map.fitBounds(day.points, { padding: [50, 50] });
        }
    </script>
</body>
</html>
