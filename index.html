<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Albania 2026 | Miguel & Marina</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #map { height: 100vh; }
        .day-panel { transition: all 0.3s ease; }
    </style>
</head>
<body class="flex flex-col md:flex-row h-screen overflow-hidden">
    <aside class="w-full md:w-1/3 h-screen overflow-y-auto bg-slate-50 border-r border-slate-200 p-6 z-20 shadow-lg">
        <h1 class="text-3xl font-bold text-slate-800 mb-2">Albania 2026</h1>
        <p class="text-slate-500 mb-6 italic">Miguel & Marina | 7-13 Agosto</p>
        <div id="itinerary" class="space-y-3"></div>
    </aside>

    <main id="map" class="flex-grow"></main>

    <script>
        const plan = [
            { id: 0, day: "Día 1: Rumbo al Sur", color: "#ef4444", points: [[41.4116, 19.7188], [40.3297, 19.4678], [40.1600, 19.6400]], plan: {
                mañana: "Recogida coche en CarQ, salida hacia Orikum.",
                mediodía: "Parada en Orikum y ascenso al Llogara Pass.",
                tarde: "Llegada al Blue Boutique Hotel, comida y tarde de piscina.",
                noche: "Cena en Royal Blue o terrazas de Dhërmi."
            }},
            { id: 1, day: "Gjipe Beach", color: "#3b82f6", points: [[40.1600, 19.6400], [40.1436, 19.6702]], plan: {
                mañana: "Caminata y relax en Gjipe Beach.",
                mediodía: "Desplazamiento a la zona de Himarë.",
                tarde: "Paseo por Castillo de Himarë y playa.",
                noche: "Regreso a Dhërmi."
            }},
            { id: 2, day: "Día 3: Exploración local", color: "#10b981", points: [[40.1600, 19.6400], [40.1550, 19.6550]], plan: {
                mañana: "Visita a playas cercanas (Drymades/Palasë).",
                mediodía: "Relax total en playa privada del hotel.",
                tarde: "Tiempo de calidad en las instalaciones.",
                noche: "Cena tradicional en Dhërmi pueblo."
            }},
            { id: 3, day: "Día 4: Corfú", color: "#f59e0b", points: [[40.1600, 19.6400], [39.8731, 20.0033], [39.6243, 19.9217]], plan: {
                mañana: "Conducción a Saranda, ferry 10:00.",
                mediodía: "Llegada Corfú, inicio excursión 13:00.",
                tarde: "Tour guiado y tiempo libre.",
                noche: "Regreso ferri 19:45, vuelta en coche."
            }},
            { id: 4, day: "Día 5: Orikum & Relax", color: "#8b5cf6", points: [[40.1600, 19.6400], [40.3297, 19.4678]], plan: {
                mañana: "Mañana de relax absoluto en el hotel.",
                mediodía: "Excursión a zona Orikum/Bahía.",
                tarde: "Tarde de relax y playa en Dhërmi.",
                noche: "Cena tranquila."
            }},
            { id: 5, day: "Día 6: Regreso a Tirana", color: "#ec4899", points: [[40.1600, 19.6400], [41.3325, 19.8242]], plan: {
                mañana: "Salida hacia Tirana.",
                mediodía: "Check-in Mondial Hotel, piscina.",
                tarde: "Bunk'Art 2 y Plaza Skanderbeg.",
                noche: "Cena en Blloku."
            }},
            { id: 6, day: "Día 7: Despedida", color: "#64748b", points: [[41.3325, 19.8242], [41.4116, 19.7188]], plan: {
                mañana: "Free Tour Tirana.",
                mediodía: "Últimas compras y comida.",
                tarde: "Traslado a aeropuerto 17:25.",
                noche: "Vuelo de regreso."
            }}
        ];

        const map = L.map('map').setView([40.5, 19.8], 9);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        const routeLayer = L.layerGroup().addTo(map);

        const container = document.getElementById('itinerary');
        plan.forEach(item => {
            const div = document.createElement('div');
            div.className = "border rounded-xl bg-white overflow-hidden shadow-sm";
            div.innerHTML = `
                <div class="p-4 cursor-pointer hover:bg-slate-50 flex justify-between items-center" onclick="toggleDay(${item.id})">
                    <h3 class="font-bold text-lg" style="color:${item.color}">${item.day}</h3>
                    <span id="icon-${item.id}">▼</span>
                </div>
                <div id="panel-${item.id}" class="hidden p-4 bg-slate-50 border-t text-sm space-y-2">
                    <p><strong>Mañana:</strong> ${item.plan.mañana}</p>
                    <p><strong>Mediodía:</strong> ${item.plan.mediodía}</p>
                    <p><strong>Tarde:</strong> ${item.plan.tarde}</p>
                    <p><strong>Noche:</strong> ${item.plan.noche}</p>
                </div>
            `;
            container.appendChild(div);
        });

        function toggleDay(id) {
            const panel = document.getElementById(`panel-${id}`);
            const icon = document.getElementById(`icon-${id}`);
            panel.classList.toggle('hidden');
            icon.innerText = panel.classList.contains('hidden') ? '▼' : '▲';
            
            // Map Logic
            routeLayer.clearLayers();
            const day = plan[id];
            L.polyline(day.points, { color: day.color, weight: 6, opacity: 0.8 }).addTo(routeLayer);
            map.fitBounds(day.points, { padding: [50, 50] });
        }
    </script>
</body>
</html>
